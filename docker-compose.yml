services:
  sentinelwatch:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - sentinelwatch-instance:/app/instance
      - sentinelwatch-storage:/app/storage
      - sentinelwatch-logs:/app/logs
    restart: unless-stopped

volumes:
  sentinelwatch-instance:
  sentinelwatch-storage:
  sentinelwatch-logs:
